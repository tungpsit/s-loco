name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint with Biome
        run: bun run lint

      - name: Typecheck API
        run: cd apps/api && bun run check

      - name: Typecheck Admin
        run: cd apps/admin && bun run check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sloco_test
          POSTGRES_USER: sloco
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test
        env:
          DATABASE_URL: postgres://sloco:test@localhost:5432/sloco_test
          REDIS_URL: redis://localhost:6379

  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f apps/api/Dockerfile -t s-loco-api:${{ github.sha }} .

      - name: Run health check
        run: docker run --rm -d --name api-test-${{ github.sha }} -p 3000:3000 s-loco-api:${{ github.sha }} && sleep 5 && docker logs api-test-${{ github.sha }}

  build-admin:
    name: Build Admin Image
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f apps/admin/Dockerfile -t s-loco-admin:${{ github.sha }} .
